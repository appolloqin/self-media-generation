<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>智媒工坊 · 启动中</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: 'Microsoft YaHei', -apple-system, sans-serif;
        background: linear-gradient(135deg, #eef2fb 0%, #eaf4f4 100%); color: #1f2937;
      }
      .box { text-align: center; }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
        background: #3a7bd5; color: #fff; font-size: 32px; line-height: 64px;
        box-shadow: 0 8px 22px rgba(58, 123, 213, .35);
      }
      .spinner {
        width: 40px; height: 40px; margin: 24px auto 0;
        border: 3px solid rgba(58, 123, 213, .2); border-top-color: #3a7bd5;
        border-radius: 50%; animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0; color: #6b7280; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">🤖</div>
      <h1>智媒工坊</h1>
      <p>正在启动本地服务，请稍候…</p>
      <div class="spinner"></div>
    </div>
  </body>
</html>
